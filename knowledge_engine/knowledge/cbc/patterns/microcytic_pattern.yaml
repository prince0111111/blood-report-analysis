id: microcytic_cbc_pattern

name: Microcytic CBC Pattern

category: cbc

description: >
  A CBC finding pattern characterized primarily by reduced red-cell
  size and hemoglobin-related indices. This pattern is not a diagnosis
  and may have multiple clinical causes.

priority: 100

required:
  - test_name: mcv
    status: low

  - test_name: mch
    status: low

supportive:
  - test_name: hemoglobin
    status: low

  - test_name: rdw
    status: high

contradictory:
  - test_name: mcv
    status: high

possible_explanations:
  - Iron deficiency may produce this pattern.
  - Thalassemia-related patterns may produce microcytosis.
  - Other causes of microcytosis are possible.